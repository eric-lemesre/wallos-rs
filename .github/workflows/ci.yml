name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wallos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: traceability
        run: cargo xtask trace
      - name: traceability artifacts drift
        run: |
          cargo xtask trace --write
          git diff --exit-code -- spec/trace-badge.json spec/TRACEABILITY.md
      - name: lint-money
        run: cargo xtask lint-money
      - name: lint-clock
        run: cargo xtask lint-clock
      - name: lint-i18n
        run: cargo xtask lint-i18n
      - name: lint-i18n-parity
        run: cargo xtask lint-i18n-parity

      - name: tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/wallos
        run: cargo test --workspace

      # Couverture, drift, api-coverage, authz-coverage : actifs quand le périmètre le permet.
      # Pour l'instant ils sont appelés pour prouver l'intégration, les seuils seront actifs après
      # stabilisation du contrat (Phase 3+).
      - name: openapi drift
        run: cargo xtask openapi --check

      - name: install cargo-deny and cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - name: deny
        run: cargo deny check
      # Advisories ignorés (cf. ADR 0020) : RUSTSEC-2024-0436 (`paste` non maintenu, proc-macro
      # build-time) et RUSTSEC-2023-0071 (`rsa`, tiré par le driver MySQL de sqlx NON utilisé —
      # absent du graphe compilé, cargo-deny le confirme). Aucun code exploitable dans notre binaire.
      - name: audit
        run: cargo audit --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0235

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Espaces de travail npm : une seule installation à la racine couvre `ui` et les coquilles
      # (ADR 0057). Le lock unique est `package-lock.json` à la racine.
      - name: install
        run: npm ci
      # Porte 9 : le client TS généré ne doit jamais diverger du contrat OpenAPI.
      - name: ts-types-drift
        run: npm run ts-types-drift
      - name: typecheck
        run: npm run typecheck
      # Porte 10 : tests de composants (vitest + Testing Library).
      - name: test
        run: npm test
      # La coquille doit se construire : c'est ce qui prouve que `@wallos/ui` se résout en PAQUET
      # et non par un chemin relatif (REQ-CLT-003).
      - name: build shell
        run: npm run build:web

  # Porte 11 : e2e L1 web (Playwright, chromium ET webkit) contre subtrack.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wallos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/wallos
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build server
        run: cargo build -p wallos-server
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Une seule installation à la racine : les espaces de travail npm hissent les dépendances
      # dans le `node_modules` racine, que Vite résout depuis n'importe quel dossier descendant.
      - name: install frontend deps
        run: npm ci
      - name: install e2e deps
        working-directory: e2e
        run: npm ci
      - name: install playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium webkit
      - name: e2e (chromium + webkit)
        working-directory: e2e
        run: npm test
