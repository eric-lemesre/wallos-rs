name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: traceability
        run: cargo xtask trace
      - name: lint-money
        run: cargo xtask lint-money
      - name: lint-clock
        run: cargo xtask lint-clock

      - name: tests
        run: cargo test --workspace

      # Couverture, drift, api-coverage, authz-coverage : actifs quand le périmètre le permet.
      # Pour l'instant ils sont appelés pour prouver l'intégration, les seuils seront actifs après
      # stabilisation du contrat (Phase 3+).
      - name: openapi drift
        run: cargo xtask openapi --check

      - name: deny
        run: cargo deny check
      - name: audit
        run: cargo audit

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install
        working-directory: frontend/ui
        run: npm ci
      # Porte 9 : le client TS généré ne doit jamais diverger du contrat OpenAPI.
      - name: ts-types-drift
        working-directory: frontend/ui
        run: npm run ts-types-drift
      - name: typecheck
        working-directory: frontend/ui
        run: npm run typecheck
