[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "warn"
ignore = [
    # `paste` « unmaintained » (RUSTSEC-2024-0436) — informatif, PAS une vulnérabilité. Proc-macro
    # build-time (aucune surface runtime), tirée uniquement par `utoipa-axum` (dernière version).
    # Décision tracée : docs/adr/0020-ignore-rustsec-2024-0436-paste.md.
    "RUSTSEC-2024-0436",
    # `rkyv 0.7` (RUSTSEC-2026-0235) — lecture hors-bornes à la désérialisation d'archives rkyv.
    # Dépendance **optionnelle et non compilée** de `rust_decimal` (`cargo tree -i rkyv` ne remonte
    # rien) : nous n'utilisons jamais rkyv. Aucune surface exploitable. Fix = rkyv 0.8 (majeure,
    # incompatible avec rust_decimal 1.37). Décision tracée : docs/adr/0029-ignore-rustsec-2026-0235-rkyv.md.
    "RUSTSEC-2026-0235",
]

[licenses]
version = 2
allow = [
    # Licence du projet lui-même (tous les crates wallos-*).
    "AGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "AGPL-3.0",
    "Unicode-DFS-2016",
    # Licence Unicode v3 : portée par les crates ICU (`icu_*`), tirées transitivement par
    # `url`/`idna` (via reqwest, sqlx). Permissive, sans clause copyleft.
    "Unicode-3.0",
    # Licence zlib : permissive, tirée transitivement (ex. crates de hachage/compression).
    "Zlib",
    # CDLA-Permissive-2.0 : licence de données permissive (ex. jeux de certificats/racines TLS),
    # tirée transitivement. Sans copyleft.
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "Unlicense",
    # 0BSD (BSD Zero Clause) : permissive, équivalent domaine public, OSI. Portée par `quoted_printable`,
    # tirée transitivement par `lettre` (canal e-mail SMTP, REQ-NOT-003 / ADR 0044).
    "0BSD",
]
confidence-threshold = 0.8

# Nos propres crates sont sous AGPL-3.0-or-later (chaîne SPDX exacte du workspace).
[[licenses.exceptions]]
name = "wallos-*"
allow = ["AGPL-3.0-or-later"]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-git = []

[sources.allow-org]
github = []
